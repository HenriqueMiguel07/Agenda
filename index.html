<script type="text/babel">
const { useState, useEffect, useMemo } = React;

/* ── PERSISTÊNCIA ─────────────────────────────────────────────────────────── */
function salvarDados(d)       { localStorage.setItem('agenda_v2', JSON.stringify(d)); }
function carregarDados()      { const r=localStorage.getItem('agenda_v2'); return r?JSON.parse(r):null; }
function salvarLembretes(r)   { localStorage.setItem('agenda_lembretes', JSON.stringify(r)); }
function carregarLembretes()  { const r=localStorage.getItem('agenda_lembretes'); return r?JSON.parse(r):[]; }

/* ── TEMAS ────────────────────────────────────────────────────────────────── */

/* ── FUNDOS ───────────────────────────────────────────────────────────────── */
const BG_MODES = {
  day:      { pageBg:'#f1f5f9', cardBg:'#ffffff', text:'#1e293b', muted:'#64748b', inputBg:'#ffffff', inputBorder:'#e2e8f0', sectionA:'#fffbeb', sectionB:'#ecfdf5', blockBg:'#f8fafc', noteBg:'rgba(255,255,255,0.6)', label:'Diurno' },
  night:    { pageBg:'#0d0d1a', cardBg:'#16162a', text:'#e2e8f0', muted:'#94a3b8', inputBg:'#1e1e38', inputBorder:'#2d2d50', sectionA:'#1a1628', sectionB:'#0f1f1a', blockBg:'#1c1c34', noteBg:'rgba(255,255,255,0.05)', label:'Noturno' },
  darkblue: { pageBg:'#020617', cardBg:'#0f172a', text:'#cbd5e1', muted:'#7dd3fc', inputBg:'#1e293b', inputBorder:'#1e3a5f', sectionA:'#0c1628', sectionB:'#091520', blockBg:'#162032', noteBg:'rgba(30,58,95,0.4)', label:'Azul Escuro' },
};

/* ── UTILS ────────────────────────────────────────────────────────────────── */
const toStr = (dt) =>
  `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
const parseD = (s) => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const toMin  = (t) => {
  if (!t) return 0;
  const c=String(t).replace(/[^\d:]/g,'');
  if (!c) return 0;
  if (c.includes(':')) { const [h,m]=c.split(':'); return (parseInt(h)||0)*60+(parseInt(m)||0); }
  return (parseInt(c)||0)*60;
};
const fmtTime = (v) => {
  if (!v) return '';
  const n=parseInt(String(v).replace(/[^\d]/g,''),10);
  if (!isNaN(n)&&n<10&&String(v).length===1) return `0${n}`;
  return v;
};
const weekAround = (base) => {
  const [y,m,d]=base.split('-').map(Number);
  const b=new Date(y,m-1,d);
  return Array.from({length:7},(_,i)=>{
    const dt=new Date(b); dt.setDate(dt.getDate()+(i-3));
    return { s:toStr(dt), name:dt.toLocaleDateString('pt-PT',{weekday:'short'}).replace('.',''), num:dt.getDate() };
  });
};
const sortBlks = (arr) => [...arr].sort((a,b)=>{
  const d=toMin(a.startTime)-toMin(b.startTime);
  return d!==0?d:toMin(a.endTime)-toMin(b.endTime);
});
const REC_LABEL = { none:'Sem repetição', daily:'Todos os dias', weekly:'Toda semana', monthly:'Todo mês' };
const REC_COUNT = { daily:30, weekly:52, monthly:24 };
const recurDates = (start,type,count) => {
  const [y,m,d]=start.split('-').map(Number);
  return Array.from({length:count},(_,i)=>{
    const dt=new Date(y,m-1,d);
    if (type==='daily')   dt.setDate(dt.getDate()+(i+1));
    if (type==='weekly')  dt.setDate(dt.getDate()+(i+1)*7);
    if (type==='monthly') dt.setMonth(dt.getMonth()+(i+1));
    return toStr(dt);
  });
};

/* ═══════════════════════════════════════════════════════════════════════════
   ABA: AGENDA
═══════════════════════════════════════════════════════════════════════════ */
function AgendaTab({ agendaData, setAgendaData, currentDate, T, BG }) {
  const [newTask,   setNewTask]   = useState({});
  const [blkStart,  setBlkStart]  = useState('');
  const [blkEnd,    setBlkEnd]    = useState('');
  const [blkTitle,  setBlkTitle]  = useState('');
  const [blkTasks,  setBlkTasks]  = useState([]); // tarefas iniciais do bloco
  const [blkNewT,   setBlkNewT]   = useState(''); // input da nova tarefa no formulário
  const [recType,   setRecType]   = useState('none');
  const [recModal,  setRecModal]  = useState(false);
  const [pending,   setPending]   = useState(null);
  const [editing,   setEditing]   = useState(null);
  const [movingTask,setMovingTask]= useState(null); // {bid, tid}
  const [movingBlk, setMovingBlk] = useState(null); // bid being moved to day
  const [delRecMenu,setDelRecMenu]= useState(null); // {bid, recId} — menu apagar recorrente
  const [openNotes, setOpenNotes] = useState({});   // bid → bool
  const [newBlkNote,setNewBlkNote]= useState({});   // bid → text
  const [editBlkN,  setEditBlkN]  = useState(null); // {bid, nid, val}

  useEffect(() => {
    setNewTask({}); setBlkStart(''); setBlkEnd(''); setBlkTitle(''); setBlkTasks([]); setBlkNewT(''); setRecType('none');
  }, [currentDate]);

  const empty = { blocks:[], notes:[], diary:{learned:'',improved:''} };
  const day   = agendaData[currentDate] || empty;
  const blks  = day.blocks || [];
  const diary = day.diary  || { learned:'', improved:'' };

  const updBlocks = (fn) => setAgendaData(prev => {
    const d=prev[currentDate]||empty;
    return { ...prev, [currentDate]: { ...d, blocks: fn(d.blocks||[]) } };
  });

  const addBlkTask = () => {
    if (!blkNewT.trim()) return;
    setBlkTasks(p=>[...p, {id:Date.now(), text:blkNewT.trim(), isCompleted:false, isImportant:false}]);
    setBlkNewT('');
  };
  const delBlkTask = (id) => setBlkTasks(p=>p.filter(t=>t.id!==id));

  const addBlock = () => {
    if (!blkStart || !blkEnd) return;
    const blk = { id:Date.now(), title:blkTitle.trim(), startTime:fmtTime(blkStart), endTime:fmtTime(blkEnd), tasks:blkTasks, recId:null };
    if (recType !== 'none') { setPending(blk); setRecModal(true); }
    else { updBlocks(p=>sortBlks([...p,blk])); setBlkStart(''); setBlkEnd(''); setBlkTitle(''); setBlkTasks([]); setBlkNewT(''); }
  };

  const confirmRec = () => {
    if (!pending) return;
    const rid = 'r'+Date.now();
    updBlocks(p=>sortBlks([...p, { ...pending, recId:rid }]));
    recurDates(currentDate, recType, REC_COUNT[recType]).forEach(ds => {
      setAgendaData(prev => {
        const d=prev[ds]||empty;
        const nb={ ...pending, id:Date.now()+Math.random(), recId:rid };
        return { ...prev, [ds]: { ...d, blocks: sortBlks([...(d.blocks||[]), nb]) } };
      });
    });
    setPending(null); setRecModal(false); setBlkStart(''); setBlkEnd(''); setBlkTitle(''); setBlkTasks([]); setBlkNewT(''); setRecType('none');
  };

  const delBlock       = (id) => updBlocks(p=>p.filter(b=>b.id!==id));
  const delRecSingle   = (bid) => { delBlock(bid); setDelRecMenu(null); };
  const delRecFuture   = (bid, recId) => {
    setAgendaData(prev => {
      const next = {};
      Object.entries(prev).forEach(([ds, d]) => {
        if (ds >= currentDate) {
          const blocks = (d.blocks||[]).filter(b => !(b.recId===recId && (ds>currentDate || b.id===bid)));
          next[ds] = { ...d, blocks };
        } else {
          next[ds] = d;
        }
      });
      return next;
    });
    setDelRecMenu(null);
  };
  const togTask   = (bid,tid) => updBlocks(p=>p.map(b=>b.id===bid?{...b,tasks:b.tasks.map(t=>t.id===tid?{...t,isCompleted:!t.isCompleted}:t)}:b));
  const togImp    = (bid,tid) => updBlocks(p=>p.map(b=>b.id===bid?{...b,tasks:b.tasks.map(t=>t.id===tid?{...t,isImportant:!t.isImportant}:t)}:b));
  const addTask   = (bid) => {
    const txt=newTask[bid];
    if (!txt?.trim()) return;
    updBlocks(p=>p.map(b=>b.id===bid?{...b,tasks:[...b.tasks,{id:Date.now(),text:txt,isCompleted:false,isImportant:false}]}:b));
    setNewTask(p=>({...p,[bid]:''}));
  };
  const delTask   = (bid,tid) => updBlocks(p=>p.map(b=>b.id===bid?{...b,tasks:b.tasks.filter(t=>t.id!==tid)}:b));
  const editTask  = (bid,tid,txt) => updBlocks(p=>p.map(b=>b.id===bid?{...b,tasks:b.tasks.map(t=>t.id===tid?{...t,text:txt}:t)}:b));
  const setTime   = (bid,f,v) => updBlocks(p=>p.map(b=>b.id===bid?{...b,[f]:v}:b));
  const blurTime  = (bid,f,v) => { setTime(bid,f,fmtTime(v)); updBlocks(p=>sortBlks(p)); };

  const moveTask  = (fromBid, tid, toBid) => {
    updBlocks(p => {
      const task = p.find(b=>b.id===fromBid)?.tasks.find(t=>t.id===tid);
      if (!task) return p;
      return p.map(b => {
        if (b.id===fromBid) return {...b, tasks:b.tasks.filter(t=>t.id!==tid)};
        if (b.id===toBid)   return {...b, tasks:[...b.tasks, task]};
        return b;
      });
    });
    setMovingTask(null);
  };

  const toggleNotes  = (bid) => setOpenNotes(p=>({...p,[bid]:!p[bid]}));
  const addBlkNote   = (bid) => {
    const txt = (newBlkNote[bid]||'').trim();
    if (!txt) return;
    updBlocks(p=>p.map(b=>b.id===bid?{...b,blkNotes:[...(b.blkNotes||[]),{id:Date.now(),text:txt}]}:b));
    setNewBlkNote(p=>({...p,[bid]:''}));
  };
  const delBlkNote   = (bid,nid) => updBlocks(p=>p.map(b=>b.id===bid?{...b,blkNotes:(b.blkNotes||[]).filter(n=>n.id!==nid)}:b));
  const saveBlkNote  = () => {
    if (!editBlkN) return;
    updBlocks(p=>p.map(b=>b.id===editBlkN.bid?{...b,blkNotes:(b.blkNotes||[]).map(n=>n.id===editBlkN.nid?{...n,text:editBlkN.val}:n)}:b));
    setEditBlkN(null);
  };

  const moveBlockToDay = (bid, targetDate) => {
    if (!targetDate || targetDate===currentDate) { setMovingBlk(null); return; }
    setAgendaData(prev => {
      const srcDay = prev[currentDate]||empty;
      const blk    = (srcDay.blocks||[]).find(b=>b.id===bid);
      if (!blk) return prev;
      const tgtDay = prev[targetDate]||empty;
      return {
        ...prev,
        [currentDate]: { ...srcDay, blocks:(srcDay.blocks||[]).filter(b=>b.id!==bid) },
        [targetDate]:  { ...tgtDay, blocks:sortBlks([...(tgtDay.blocks||[]), {...blk,id:Date.now()}]) },
      };
    });
    setMovingBlk(null);
  };

  const startEdit = (cfg) => setEditing(cfg);
  const saveEdit  = () => {
    if (!editing) return;
    if (editing.type==='task') editTask(editing.bid, editing.tid, editing.val);
    setEditing(null);
  };
  const updDiary = (f,v) => setAgendaData(prev => {
    const d=prev[currentDate]||empty;
    return { ...prev, [currentDate]: { ...d, diary:{...(d.diary||{}),[f]:v} } };
  });

  return (
    <div className="fade" style={{color:BG.text}}>
      <div className="p-6">
        {blks.length===0 ? (
          <div className="text-center py-12" style={{color:BG.muted}}>
            <IcoClock className="w-12 h-12 mx-auto mb-3 opacity-20"/>
            <p className="text-sm">Nenhum compromisso para este dia.</p>
          </div>
        ) : (
          <div className="space-y-6">
            {blks.map(blk => (
              <div key={blk.id} className="flex gap-4">
                {/* Timeline */}

/* ═══════════════════════════════════════════════════════════════════════════
   ABA: LEMBRETES
═══════════════════════════════════════════════════════════════════════════ */
function RemindersTab({ reminders, setReminders, T, BG }) {
  const [text,    setText]    = useState('');
  const [editing, setEditing] = useState(null); // {id, val}

  const add = () => {
    if (!text.trim()) return;
    setReminders(p=>[...p, {id:Date.now(), text:text.trim(), createdAt:toStr(new Date())}]);
    setText('');
  };

  const del    = (id) => setReminders(p=>p.filter(r=>r.id!==id));
  const save   = () => {
    if (!editing) return;
    setReminders(p=>p.map(r=>r.id===editing.id?{...r,text:editing.val}:r));
    setEditing(null);
  };

  return (
    <div className="fade p-6" style={{color:BG.text}}>
      <div className="flex items-center gap-2 mb-6">
        <IcoBell className="w-5 h-5" style={{color:T.p}}/>
        <h2 className="text-base font-semibold" style={{color:BG.text}}>Lembretes</h2>
        <span className="ml-auto text-xs px-2 py-0.5 rounded-full font-medium" style={{background:T.lt,color:T.tx}}>
          {reminders.length}
        </span>
      </div>

      {reminders.length===0 ? (
        <div className="text-center py-16" style={{color:BG.muted}}>
          <IcoBell className="w-12 h-12 mx-auto mb-3 opacity-20"/>
          <p className="text-sm">Nenhum lembrete ainda.</p>
          <p className="text-xs mt-1 opacity-70">Os lembretes ficam aqui permanentemente.</p>
        </div>
      ) : (
        <ul className="space-y-2 mb-6">
          {reminders.map(r => {
            const isEdit = editing&&editing.id===r.id;
            return (
              <li key={r.id} className="flex items-center gap-3 px-4 py-3 rounded-xl border"
                style={{background:BG.blockBg,borderColor:BG.inputBorder}}>
                <span className="w-2 h-2 rounded-full shrink-0" style={{background:T.p}}/>
                {isEdit ? (
                  <input autoFocus type="text" value={editing.val}
                    onChange={e=>setEditing(p=>({...p,val:e.target.value}))}
                    onBlur={save}
                    onKeyDown={e=>{if(e.key==='Enter')save();if(e.key==='Escape')setEditing(null);}}
                    className="flex-1 text-sm border rounded px-2 py-0.5 focus:outline-none"
                    style={{background:BG.inputBg,color:BG.text,borderColor:T.p}}/>
                ) : (
                  <span onDoubleClick={()=>setEditing({id:r.id,val:r.text})}
                    title="Duplo clique para editar"
                    className="flex-1 text-sm cursor-text" style={{color:BG.text}}>
                    {r.text}
                  </span>
                )}
                {!isEdit && (
                  <div className="flex items-center gap-2 shrink-0">
                    <span className="text-[10px]" style={{color:BG.muted}}>{r.createdAt}</span>
                    <button onClick={()=>del(r.id)} className="hover:text-red-400 transition-colors" style={{color:BG.muted}}>
                      <IcoTrash className="w-4 h-4"/>
                    </button>
                  </div>
                )}
              </li>
            );
          })}
        </ul>
      )}

      <div className="flex gap-2">
        <input type="text" placeholder="Novo lembrete permanente..."
          value={text} onChange={e=>setText(e.target.value)}
          onKeyDown={e=>e.key==='Enter'&&add()}
          className="flex-1 text-sm border rounded-lg px-3 py-2 focus:outline-none"
          style={{background:BG.inputBg,color:BG.text,borderColor:BG.inputBorder}}/>
        <button onClick={add} className="px-4 py-2 text-white text-sm rounded-lg hover:opacity-90 transition-opacity"
          style={{background:T.p}}>Adicionar</button>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════════════
   ABA: CALENDÁRIO
═══════════════════════════════════════════════════════════════════════════ */
function CalendarTab({ agendaData, setCurrentDate, setActiveTab, T, BG }) {
  const today = toStr(new Date());
  const initYM = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; };
  const [ym,    setYm]    = useState(initYM);
  const [query, setQuery] = useState('');

  const [yr,mo] = ym.split('-').map(Number);
  const first   = new Date(yr,mo-1,1);
  const last    = new Date(yr,mo,0);
  const offset  = (first.getDay()+6)%7;
  const cells   = Math.ceil((offset+last.getDate())/7)*7;

  const busy = useMemo(()=>{
    const s=new Set();
    Object.entries(agendaData).forEach(([ds,d])=>{
      if ((d.blocks||[]).length||(d.notes||[]).length) s.add(ds);
    });
    return s;
  },[agendaData]);

  const results = useMemo(()=>{
    if (!query.trim()) return [];
    const q=query.toLowerCase();
    const out=[];
    Object.entries(agendaData).forEach(([ds,d])=>{
      (d.blocks||[]).forEach(b=>{
        b.tasks.forEach(t=>{
          if (t.text.toLowerCase().includes(q))
            out.push({ds,text:t.text,ctx:`${b.startTime}h – ${b.endTime}h${b.title?' ('+b.title+')':''}`});
        });
      });
      (d.notes||[]).forEach(n=>{
        if (n.text.toLowerCase().includes(q))
          out.push({ds,text:n.text,ctx:'Lembrete'});
      });
    });
    return out.sort((a,b)=>a.ds.localeCompare(b.ds));
  },[agendaData,query]);

  const prevM = ()=>{ const d=new Date(yr,mo-2,1); setYm(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`); };
  const nextM = ()=>{ const d=new Date(yr,mo,1);   setYm(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`); };
  const goDay = (ds)=>{ setCurrentDate(ds); setActiveTab('agenda'); };
  const mLabel = new Date(yr,mo-1,1).toLocaleDateString('pt-PT',{month:'long',year:'numeric'});

  return (
    <div className="fade p-6" style={{color:BG.text}}>
      <div className="flex items-center justify-between mb-5">
        <button onClick={prevM} className="p-2 rounded-lg hover:opacity-70" style={{color:BG.text}}><IcoChevL className="w-5 h-5"/></button>
        <span className="font-semibold capitalize" style={{color:BG.text}}>{mLabel}</span>
        <button onClick={nextM} className="p-2 rounded-lg hover:opacity-70" style={{color:BG.text}}><IcoChevR className="w-5 h-5"/></button>
      </div>
      <div className="grid grid-cols-7 gap-1 mb-1">
        {['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(d=>(
          <div key={d} className="text-center text-xs font-semibold py-1" style={{color:BG.muted}}>{d}</div>
        ))}
      </div>
      <div className="grid grid-cols-7 gap-1 mb-5">
        {Array.from({length:cells},(_,i)=>{
          const dn=i-offset+1;
          if (dn<1||dn>last.getDate()) return <div key={i}/>;
          const ds=`${yr}-${String(mo).padStart(2,'0')}-${String(dn).padStart(2,'0')}`;
          const hasBusy=busy.has(ds);
          const isToday=ds===today;
          return (
            <button key={i} onClick={()=>goDay(ds)}
              className="relative aspect-square flex flex-col items-center justify-center rounded-xl text-sm font-medium transition-all hover:opacity-80"
              style={{
                background:hasBusy?T.lt:'transparent',
                color:isToday?T.p:hasBusy?T.tx:'#64748b',
                fontWeight:isToday||hasBusy?600:400,
                border:isToday?`2px solid ${T.p}`:'2px solid transparent',
              }}>
              {dn}
              {hasBusy&&<span className="absolute bottom-1 w-1.5 h-1.5 rounded-full" style={{background:T.p}}/>}
            </button>
          );
        })}
      </div>
      <div className="flex items-center gap-3 text-xs mb-6" style={{color:BG.muted}}>
        <span className="inline-flex items-center gap-1.5">
          <span className="w-4 h-4 rounded" style={{background:T.lt,border:`1px solid ${T.p}`}}/>Com compromissos
        </span>
        <span className="inline-flex items-center gap-1.5">
          <span className="w-4 h-4 rounded" style={{border:`2px solid ${T.p}`}}/>Hoje
        </span>
      </div>
      <div className="border-t pt-5" style={{borderColor:BG.inputBorder}}>
        <h3 className="text-sm font-semibold flex items-center gap-2 mb-3" style={{color:BG.muted}}>
          <IcoSearch className="w-4 h-4"/> Buscar em eventos
        </h3>
        <div className="flex gap-2 mb-4">
          <input type="text" placeholder="Palavra-chave..." value={query}
            onChange={e=>setQuery(e.target.value)}
            className="flex-1 text-sm border rounded-lg px-3 py-2 focus:outline-none"
            style={{background:BG.inputBg,color:BG.text,borderColor:BG.inputBorder}}/>
          {query&&(<button onClick={()=>setQuery('')} className="p-2 hover:opacity-70" style={{color:BG.muted}}><IcoX className="w-4 h-4"/></button>)}
        </div>
        {query.trim()&&(
          <div className="space-y-2">
            {results.length===0?(
              <p className="text-sm text-center py-6" style={{color:BG.muted}}>Nenhum resultado encontrado.</p>
            ):results.map((r,i)=>{
              const label=parseD(r.ds).toLocaleDateString('pt-PT',{day:'numeric',month:'short',year:'numeric'});
              const parts=r.text.split(new RegExp('('+query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'));
              return (
                <button key={i} onClick={()=>goDay(r.ds)}
                  className="w-full text-left flex items-start gap-3 px-4 py-3 rounded-xl border transition-colors hover:opacity-80"
                  style={{borderColor:BG.inputBorder,background:BG.blockBg}}>
                  <div className="shrink-0 text-xs px-2 py-1 rounded-lg font-semibold" style={{background:T.lt,color:T.tx}}>{label}</div>
                  <div>
                    <div className="text-sm" style={{color:BG.text}}>
                      {parts.map((pt,pi)=>
                        pt.toLowerCase()===query.toLowerCase()
                          ?<mark key={pi} style={{background:T.lt,color:T.tx,borderRadius:3,padding:'0 2px'}}>{pt}</mark>
                          :<span key={pi}>{pt}</span>
                      )}
                    </div>
                    <div className="text-xs mt-0.5" style={{color:BG.muted}}>{r.ctx}</div>
                  </div>
                </button>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════════════
   ABA: CONFIGURAÇÕES
═══════════════════════════════════════════════════════════════════════════ */
const BG_MODE_META = {
  day:      { Icon:IcoSun,   label:'Diurno'      },
  night:    { Icon:IcoMoon,  label:'Noturno'     },
  darkblue: { Icon:IcoWater, label:'Azul Escuro' },
};

function SettingsTab({ theme, setTheme, bgMode, setBgMode, T, BG }) {
  return (
    <div className="fade p-6" style={{color:BG.text}}>
      <h2 className="text-base font-semibold flex items-center gap-2 mb-5" style={{color:BG.text}}>
        <IcoPalette className="w-5 h-5"/> Tema de Cores
      </h2>
      <div className="grid grid-cols-2 gap-3 mb-8">
        {Object.entries(THEMES).map(([k,t])=>(
          <button key={k} onClick={()=>setTheme(k)}
            className="flex items-center gap-3 px-4 py-3 rounded-xl border-2 transition-all"
            style={{borderColor:theme===k?t.p:BG.inputBorder,background:theme===k?t.lt:BG.blockBg}}>
            <span className="w-8 h-8 rounded-full shrink-0 shadow-sm" style={{background:`linear-gradient(135deg,${t.p},${t.dk})`}}/>
            <span className="text-sm font-medium" style={{color:theme===k?t.tx:BG.muted}}>{t.label}</span>
            {theme===k&&<IcoCheck className="w-4 h-4 ml-auto" style={{color:t.p}}/>}
          </button>
        ))}
      </div>
      <div className="border-t pt-6" style={{borderColor:BG.inputBorder}}>
        <h2 className="text-base font-semibold flex items-center gap-2 mb-4" style={{color:BG.text}}>
          <IcoMoon className="w-5 h-5"/> Fundo da Aplicação
        </h2>
        <div className="flex gap-3">
          {Object.entries(BG_MODE_META).map(([k,{Icon,label}])=>{
            const bg=BG_MODES[k]; const active=bgMode===k;
            return (
              <button key={k} onClick={()=>setBgMode(k)}
                className="flex-1 flex flex-col items-center gap-2 py-4 rounded-xl border-2 transition-all"
                style={{borderColor:active?T.p:BG.inputBorder,background:bg.cardBg}}>
                <Icon className="w-6 h-6" style={{color:active?T.p:bg.muted}}/>
                <span className="text-xs font-semibold" style={{color:active?T.p:bg.muted}}>{label}</span>
                {active&&<span className="w-2 h-2 rounded-full" style={{background:T.p}}/>}
              </button>
            );
          })}
        </div>
      </div>
      <div className="mt-8 border-t pt-5" style={{borderColor:BG.inputBorder}}>
        <h2 className="text-base font-semibold flex items-center gap-2 mb-3" style={{color:BG.text}}>
          <IcoSettings className="w-5 h-5"/> Sobre
        </h2>
        <p className="text-sm" style={{color:BG.muted}}>Minha Agenda v3.0 — dados salvos localmente no navegador.</p>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════════════
   APP RAIZ
═══════════════════════════════════════════════════════════════════════════ */
function App() {
  const todayStr = toStr(new Date());

  const [data,      setData]      = useState(()=>carregarDados()||{});
  const [reminders, setRemRaw]    = useState(()=>carregarLembretes());
  const [theme,     setThemeRaw]  = useState(()=>localStorage.getItem('agenda_theme')||'indigo');
  const [bgMode,    setBgModeRaw] = useState(()=>localStorage.getItem('agenda_bg')||'day');
  const [tab,       setTab]       = useState('agenda');
  const [curDate,   setCurDate]   = useState(todayStr);

  const T  = THEMES[theme]||THEMES.indigo;
  const BG = BG_MODES[bgMode]||BG_MODES.day;

  useEffect(()=>{ salvarDados(data); },[data]);

  const setReminders = (fn) => {
    const next = typeof fn==='function' ? fn(reminders) : fn;
    setRemRaw(next);
    salvarLembretes(next);
  };

  const setTheme  = (t) => { setThemeRaw(t);  localStorage.setItem('agenda_theme',t); };
  const setBgMode = (m) => { setBgModeRaw(m); localStorage.setItem('agenda_bg',m); };
  const shiftDate = (n) => { const d=parseD(curDate); d.setDate(d.getDate()+n); setCurDate(toStr(d)); };
  const fmtMY     = (s) => parseD(s).toLocaleDateString('pt-PT',{month:'long',year:'numeric'});
  const week      = weekAround(curDate);

  const TABS = [
    {id:'agenda',    label:'Agenda',        Icon:IcoCalendar},
    {id:'calendar',  label:'Calendário',    Icon:IcoGrid    },
    {id:'reminders', label:'Lembretes',     Icon:IcoBell    },
    {id:'settings',  label:'Configurações', Icon:IcoSettings},
  ];

  return (
    <div className="min-h-screen p-4 md:p-8 font-sans" style={{background:BG.pageBg}}>
      <div className="max-w-2xl mx-auto rounded-2xl shadow-xl overflow-hidden" style={{background:BG.cardBg}}>

        {/* HEADER */}
        <div className="text-white p-6" style={{background:`linear-gradient(135deg,${T.p},${T.dk})`}}>
          <div className="flex justify-between items-center mb-4">
            <h1 className="text-xl font-bold flex items-center gap-2">
              <IcoCalendar className="w-6 h-6"/> Minha Agenda
            </h1>
            {tab==='agenda'&&curDate!==todayStr&&(
              <button onClick={()=>setCurDate(todayStr)}
                className="px-3 py-1 rounded-full text-xs font-semibold hover:opacity-80"
                style={{background:'rgba(255,255,255,0.25)'}}>Hoje</button>
            )}
            {tab==='reminders'&&(
              <span className="px-3 py-1 rounded-full text-xs font-semibold"
                style={{background:'rgba(255,255,255,0.25)'}}>
                {reminders.length} lembrete{reminders.length!==1?'s':''}
              </span>
            )}
          </div>

          {tab==='agenda'&&(
            <>
              <div className="flex items-center justify-between px-1 mb-3">
                <button onClick={()=>shiftDate(-7)} className="p-1.5 rounded-lg hover:bg-white/20"><IcoChevL className="w-5 h-5"/></button>
                <div className="relative cursor-pointer">
                  <span className="text-base font-medium capitalize">{fmtMY(curDate)}</span>
                  <input type="date" value={curDate} onChange={e=>setCurDate(e.target.value)}
                    className="absolute inset-0 opacity-0 cursor-pointer"/>
                </div>
                <button onClick={()=>shiftDate(7)} className="p-1.5 rounded-lg hover:bg-white/20"><IcoChevR className="w-5 h-5"/></button>
              </div>
              <div className="flex justify-between items-center rounded-2xl p-2" style={{background:'rgba(0,0,0,0.2)'}}>
                {week.map(w=>{
                  const sel=w.s===curDate;
                  return (
                    <button key={w.s} onClick={()=>setCurDate(w.s)}
                      className="flex flex-col items-center justify-center w-11 h-14 rounded-xl transition-all"
                      style={sel
                        ?{background:'#fff',color:T.p,boxShadow:'0 4px 12px rgba(0,0,0,0.15)'}
                        :{color:'rgba(255,255,255,0.85)'}}>
                      <span className="text-xs">{w.name}</span>
                      <span className="text-lg font-bold">{w.num}</span>
                    </button>
                  );
                })}
              </div>
            </>
          )}

          {/* Abas */}
          <div className="flex gap-1 mt-4 flex-wrap">
            {TABS.map(({id,label,Icon})=>{
              const active=tab===id;
              return (
                <button key={id} onClick={()=>setTab(id)}
                  className="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold transition-all"
                  style={active
                    ?{background:'rgba(255,255,255,0.28)',color:'#fff'}
                    :{color:'rgba(255,255,255,0.65)'}}>
                  <Icon className="w-3.5 h-3.5"/>{label}
                </button>
              );
            })}
          </div>
        </div>

        {/* CONTEÚDO */}
        {tab==='agenda'&&(
          <AgendaTab agendaData={data} setAgendaData={setData} currentDate={curDate} T={T} BG={BG}/>
        )}
        {tab==='calendar'&&(
          <CalendarTab agendaData={data} setCurrentDate={setCurDate} setActiveTab={setTab} T={T} BG={BG}/>
        )}
        {tab==='reminders'&&(
          <RemindersTab reminders={reminders} setReminders={setReminders} T={T} BG={BG}/>
        )}
        {tab==='settings'&&(
          <SettingsTab theme={theme} setTheme={setTheme} bgMode={bgMode} setBgMode={setBgMode} T={T} BG={BG}/>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
